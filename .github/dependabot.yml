version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: [ "dependencies" ]
    groups:
      gradle-plugins:
        patterns:
          - "xyz.jpenilla.run-paper*"
          - "org.gradle.toolchains.foojay-resolver*"
      papermc:
        patterns:
          - "io.papermc.paper:*"
      lombok:
        patterns:
          - "io.freefair.lombok*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: [ "dependencies" ]
    groups:
      actions-core:
        patterns:
          - "actions/*"
          - "google-github-actions/*"
          - "gradle/actions"
          - "softprops/action-gh-release"

